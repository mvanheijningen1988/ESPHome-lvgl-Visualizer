name: Docker Release

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/esp-home-lvgl-visualizer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image version
        id: version
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          base_version=$(node -e "process.stdout.write(require('./package.json').version.split('-')[0])")

          if [[ "$BRANCH" == "main" ]]; then
            version="$base_version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "image-tags=${{ env.IMAGE_NAME }}:$version,${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            version="${base_version}-dev"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "image-tags=${{ env.IMAGE_NAME }}:$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image-tags }}
          labels: |
            org.opencontainers.image.title=ESPHome LVGL Visualizer
            org.opencontainers.image.description=Browser-based ESPHome LVGL visualizer with native WebAssembly preview
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          username = os.environ["DOCKERHUB_USERNAME"]
          token = os.environ["DOCKERHUB_TOKEN"]
          description = pathlib.Path("DOCKERHUB_DESCRIPTION.md").read_text(encoding="utf-8")
          payload = json.dumps({"full_description": description}).encode("utf-8")

          req = urllib.request.Request(
              f"https://hub.docker.com/v2/repositories/{username}/esp-home-lvgl-visualizer/",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="PATCH",
          )
          auth = base64.b64encode(f"{username}:{token}".encode("utf-8")).decode("ascii")
          req.add_header("Authorization", f"Basic {auth}")

          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 202):
                  raise RuntimeError(f"Unexpected Docker Hub response: {response.status}")
              print(f"Docker Hub description updated for {username}/esp-home-lvgl-visualizer")
          PY
